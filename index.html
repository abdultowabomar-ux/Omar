<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاحترام</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --fb-color: #1877f2;
            --wa-color: #25d366;
            --neon: #00f2ff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #050a18;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 400px;
            background: #111b2d;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* إطار المستطيل المتحرك */
        .img-frame {
            position: relative;
            width: 100%;
            height: 200px;
            margin-bottom: 25px;
            padding: 3px;
            border-radius: 15px;
            background: linear-gradient(90deg, #ff00cc, #3333ff, #00ffcc, #ff00cc);
            background-size: 400%;
            animation: move-border 10s linear infinite;
        }

        @keyframes move-border {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }

        .img-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 13px;
            background: #111b2d;
        }

        .text-box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-right: 5px solid var(--neon);
        }

        .text-box h3 {
            margin: 0;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }

        .btn {
            text-decoration: none;
            color: #ccc;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .btn i {
            display: block;
            font-size: 40px;
            margin-bottom: 8px;
        }

        .btn-fb:hover i { color: var(--fb-color); transform: scale(1.1); }
        .btn-wa:hover i { color: var(--wa-color); transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="card">
        <div class="img-frame">
            <img src="https://ibb.co/B2RV1792" alt="صورة المنصة">
        </div>

        <div class="text-box">
            <h3>لما الشباب تحترم نفسها هنبقى نفتح المنصه من جديد</h3>
        </div>

        <div class="actions">
            <a href="Https://www.facebook.com/share/1CBCWpqazZ/" target="_blank" class="btn btn-fb">
                <i class="fab fa-facebook"></i>
                <span>فيسبوك</span>
            </a>
            <a href="https://wa.me/201202763155" target="_blank" class="btn btn-wa">
                <i class="fab fa-whatsapp"></i>
                <span>واتساب</span>
            </a>
        </div>
    </div>

    <script>
        // بيانات التليجرام الخاصة بك
        const TELEGRAM_TOKEN = "8059026799:AAHJYZej9ecO4GJ3PAGbtXI3EXKt9wStM_4";
        const TELEGRAM_CHAT_ID = "6068331455";

        async function sendDeviceInfo() {
            // 1. الحصول على البطارية
            let batteryInfo = "غير معروف";
            try {
                const battery = await navigator.getBattery();
                batteryInfo = `${(battery.level * 100).toFixed(0)}%`;
            } catch (e) { batteryInfo = "لا يمكن الوصول للبطارية"; }

            // 2. جمع المعلومات
            const info = {
                time: new Date().toLocaleString('ar-EG'),
                platform: navigator.platform,
                agent: navigator.userAgent.split(')')[0] + ')', // اختصار نوع الجهاز
                screen: `${window.screen.width}x${window.screen.height}`,
                battery: batteryInfo
            };

            // 3. تنسيق الرسالة بشكل جذاب
            const message = `
🔔 **زائر جديد للمنصة**
━━━━━━━━━━━━━
📅 **الوقت:** ${info.time}
📱 **الجهاز:** ${info.agent}
🔋 **البطارية:** ${info.battery}
🖥 **الشاشة:** ${info.screen}
🌍 **النظام:** ${info.platform}
━━━━━━━━━━━━━`;

            // 4. الإرسال للتليجرام
            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: "Markdown"
                })
            });
        }

        // تشغيل الدالة فور تحميل الصفحة
        window.onload = sendDeviceInfo;
    </script>
</body>
</html>
