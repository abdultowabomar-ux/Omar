    <style>
        :root {
            --primary: #0f2027;
            --secondary: #ce1212;
            --accent: #f8b500;
            --bg: #eef2f3;

        }

        #blur-overlay {

            background: rgba(15, 32, 39, 0.7);
            backdrop-filter: blur(12px); /* قوة التغبيش */
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border-top: 6px solid var(--accent);
        }

        .login-card h2 { color: var(--primary); margin-bottom: 20px; }
        
        .login-input, .login-select {
            width: 100% !important;
            padding: 12px !important;
            margin-bottom: 15px !important;
            border: 2px solid #ddd !important;
            border-radius: 10px !important;
            box-sizing: border-box !important;
            font-family: inherit;
            font-size: 1rem;
        }

        .confirm-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        
        .confirm-btn:hover { background: var(--secondary); }

        /* -------------------------------------- */

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            margin: 0;
            color: #333;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 5px solid var(--accent);
        }

        .nav-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .nav-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            font-size: 1rem;
        }

        .btn-study { background: var(--primary); color: white; }
        .btn-quiz { background: var(--secondary); color: white; }
        .nav-btn:hover { opacity: 0.8; transform: translateY(-2px); }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        /* وضع الدراسة */
        .search-box {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 1.1rem;
        }

        .group-container {
            background: white;
            margin-bottom: 25px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .group-header {
            background: #2c5364;
            color: white;
            padding: 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1px;
            background: #eee;
        }

        .vocab-item {
            background: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .en-text { font-weight: bold; color: var(--secondary); font-family: 'Courier New', Courier, monospace; }

        /* وضع الاختبار */
        #quiz-section { display: none; text-align: center; }
        .quiz-box {
            background: white;
            max-width: 500px;
            margin: 20px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-top: 8px solid var(--accent);
        }

        .q-title { font-size: 1.8rem; margin-bottom: 20px; color: var(--primary); }
        
        input[type="text"] {
            width: 90%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .opt-btn {
            padding: 12px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .opt-btn:hover { background: var(--accent); }

        .hidden { display: none; }

        /* --- كود أيقونة واتساب الجديدة المعدلة بالتدرج اللوني للموقع --- */
        .whatsapp-float {

            font-size: 24px;

</head>

    const allVocab = Object.values(fullDatabase).flat();

    function initStudy() {
        const list = document.getElementById('studyList');
        let html = '';
        for(let section in fullDatabase) {
            html += `<div class="group-container">
                        <div class="group-header">${section}</div>
                        <div class="vocab-grid">`;
            fullDatabase[section].forEach(item => {
                html += `<div class="vocab-item">
                            <span>${item.ar}</span>
                            <span class="en-text">${item.en}</span>
                         </div>`;
            });
            html += `</div></div>`;
        }
        list.innerHTML = html;
    }

    function filterVocab() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const items = document.querySelectorAll('.vocab-item');
        items.forEach(item => {
            item.style.display = item.innerText.toLowerCase().includes(query) ? "flex" : "none";
        });
    }

    function showSection(s) {
        document.getElementById('study-section').style.display = s==='study'?'block':'none';
        document.getElementById('quiz-section').style.display = s==='quiz'?'block':'none';
    }

    function nextQuestion() {
        document.getElementById('quiz-init').classList.add('hidden');
        document.getElementById('quiz-content').classList.remove('hidden');
        const randomItem = allVocab[Math.floor(Math.random()*allVocab.length)];
        document.getElementById('questionText').innerText = randomItem.ar;
        
        let opts = [randomItem.en];
        while(opts.length < 4) {
            let r = allVocab[Math.floor(Math.random()*allVocab.length)].en;
            if(!opts.includes(r)) opts.push(r);
        }
        opts.sort(() => Math.random() - 0.5);
        
        const area = document.getElementById('optionsArea');
        area.innerHTML = "";
        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = "opt-btn";
            b.innerText = o;
            b.onclick = () => {
                if(o === randomItem.en) { b.style.background="#2ecc71"; alert("صح!"); }
                else { b.style.background="#e74c3c"; alert("خطأ! الإجابة: " + randomItem.en); }
            };
            area.appendChild(b);
        });
    }

    initStudy();
