<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التطوير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --orange: #FF8C00;
            --blue: #00CCFF;
            --dark-blue: #050a14;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--dark-blue);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 50% 50%, #112240 0%, #050a14 100%);
        }

        .header-status h1 {
            color: var(--orange);
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            width: 90%;
            max-width: 450px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .video-box {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--blue);
            margin-bottom: 20px;
        }

        video { width: 100%; display: block; background: #000; }

        /* منطقة الإرسال - تحت الفيديو مباشرة */
        .input-section {
            margin-bottom: 25px;
            text-align: right;
        }

        .input-section label {
            font-size: 0.9rem;
            color: #bdc3c7;
            margin-bottom: 8px;
            display: block;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: white;
            resize: none;
            font-size: 0.9rem;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.2);
        }

        .send-btn {
            width: 100%;
            background: var(--orange);
            color: var(--dark-blue);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }

        .send-btn:hover {
            background: var(--blue);
            transform: translateY(-2px);
        }

        /* أيقونات التواصل - في الأسفل */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }

        .social-links a { font-size: 2.2rem; transition: 0.3s; }
        .fa-facebook { color: #1877F2; }
        .fa-whatsapp { color: #25D366; }
        .social-links a:hover { transform: scale(1.2); filter: brightness(1.2); }

        /* حقوق الملكية */
        .copyright {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #5d6d7e;
            text-align: center;
            letter-spacing: 1px;
        }

        .copyright b { color: var(--blue); }
    </style>
</head>
<body>

    <div class="header-status">
        <h1><i class="fas fa-tools"></i> جاري تطوير المنصة</h1>
    </div>

    <div class="card">
        <div class="video-box">
            <video controls>
                <source src="./VN٢٠٢٦٠١٠٢_٠٣٠٥٥٩.mp4" type="video/mp4">
            </video>
        </div>

        <div class="input-section">
            <label>لو عندك أي أسئلة أو مصطلحات ابعتها لنا:</label>
            <textarea id="userMessage" rows="3" placeholder="اكتب هنا..."></textarea>
            <button class="send-btn" onclick="sendUserFeedback()">إرسال للمطورين</button>
        </div>

        <div class="social-links">
            <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="https://wa.me/201202763155" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
    </div>

    <div class="copyright">
        &copy; 2026 All Rights Reserved <br>
        Developed by <b>Omar Abdel Tawab Saleh</b>
    </div>

    <script>
        const TELEGRAM_TOKEN = "8059026799:AAHJYZej9ecO4GJ3PAGbtXI3EXKt9wStM_4";
        const TELEGRAM_CHAT_ID = "6068331455";

        function sendToTelegram(text) {
            const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
            return fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text, parse_mode: "Markdown" })
            });
        }

        function sendUserFeedback() {
            const msgInput = document.getElementById('userMessage');
            const message = msgInput.value.trim();

            if (message === "") {
                alert("من فضلك اكتب المصطلح أولاً");
                return;
            }

            sendToTelegram(`📩 *رسالة جديدة*\n\n${message}`)
                .then(() => {
                    alert("تم الإرسال بنجاح!");
                    msgInput.value = "";
                });
        }

        window.onload = () => {
            sendToTelegram("🚀 *زائر جديد دخل الصفحة*");
        };
    </script>
</body>
</html>
