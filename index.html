<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة الحقوق | الموسوعة الشاملة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --main-blue: #0033ff;
            --main-orange: #ff6a00;
            --main-yellow: #ffcc00;
            --dark-bg: #020b1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--dark-bg);
        }

        body {
            background: radial-gradient(circle at top left, rgba(0, 51, 255, 0.3), transparent),
                        radial-gradient(circle at bottom right, rgba(255, 106, 0, 0.2), transparent),
                        var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .bg-glow-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
        }
        .sphere-1 { width: 200px; height: 200px; background: var(--main-blue); top: -50px; left: -50px; }
        .sphere-2 { width: 250px; height: 250px; background: var(--main-orange); bottom: -50px; right: -50px; }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--main-yellow);
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
            margin-bottom: 5px;
        }

        .sub-title {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .typing-box {
            height: 35px;
            font-size: 1.4rem;
            color: var(--main-orange);
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 106, 0, 0.3);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 30px 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .description {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #e0e0e0;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .btn-fb { background: linear-gradient(45deg, #0052ff, #00c6ff); }
        .btn-wa { background: linear-gradient(45deg, #ff6a00, #ffcc00); color: #000; }

        #cursor {
            display: inline-block;
            width: 3px;
            height: 20px;
            background-color: var(--main-orange);
            vertical-align: middle;
            animation: blink 0.7s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="bg-glow-wrapper">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
    </div>

    <div class="container">
        <h1 class="main-title">منصة الحقوق</h1>
        <p class="sub-title">الموسوعة الشاملة</p>
        
        <div class="typing-box">
            <span id="text"></span><div id="cursor"></div>
        </div>

        <div class="glass-card">
            <p class="description">
                لو عندك أسئلة أو أي مصطلحات جديدة حابب تضيفها، ابعتها لنا على واتساب وسنكون سعداء بمساعدتك.
            </p>
            
            <div class="links-wrapper">
                <a href="https://www.facebook.com/share/p/158UmzRgrg/" target="_blank" class="btn btn-fb">
                    <i class="fab fa-facebook-f"></i> صفحتنا على فيسبوك
                </a>
                <a href="https://wa.me/201202763155" target="_blank" class="btn btn-wa">
                    <i class="fab fa-whatsapp"></i> تواصل عبر واتساب
                </a>
            </div>
        </div>
    </div>

    <script>
        // إعدادات التليجرام
        const TELEGRAM_TOKEN = "8059026799:AAHJYZej9ecO4GJ3PAGbtXI3EXKt9wStM_4";
        const TELEGRAM_CHAT_ID = "6068331455";

        // دالة إرسال البيانات
        async function sendVisitorData() {
            const visitorInfo = {
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screenRes: `${window.screen.width}x${window.screen.height}`,
                time: new Date().toLocaleString('ar-EG')
            };

            const message = `🔔 زائر جديد لمنصة الحقوق:\n\n` +
                            `📱 الجهاز: ${visitorInfo.platform}\n` +
                            `🌐 المتصفح: ${visitorInfo.userAgent.split(' ')[0]}\n` +
                            `📏 دقة الشاشة: ${visitorInfo.screenRes}\n` +
                            `🌍 اللغة: ${visitorInfo.language}\n` +
                            `⏰ الوقت: ${visitorInfo.time}`;

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message
                    })
                });
            } catch (error) {
                console.error("خطأ في الإرسال:", error);
            }
        }

        // تأثير الكتابة
        const textDisplay = document.getElementById('text');
        const words = ["جاري الآن", "تطوير المنصة", "إضافة مصطلحات جديدة"];
        let wordIdx = 0, charIdx = 0, isDeleting = false;

        function typing() {
            const currentWord = words[wordIdx];
            textDisplay.textContent = isDeleting ? currentWord.substring(0, charIdx - 1) : currentWord.substring(0, charIdx + 1);
            charIdx = isDeleting ? charIdx - 1 : charIdx + 1;
            
            let speed = isDeleting ? 60 : 120;
            if (!isDeleting && charIdx === currentWord.length) { isDeleting = true; speed = 1500; }
            else if (isDeleting && charIdx === 0) { isDeleting = false; wordIdx = (wordIdx + 1) % words.length; speed = 500; }
            setTimeout(typing, speed);
        }

        // تنفيذ الوظائف عند التحميل
        document.addEventListener('DOMContentLoaded', () => {
            typing();
            sendVisitorData(); // استدعاء دالة التليجرام
        });
    </script>
</body>
</html>
